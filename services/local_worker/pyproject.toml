[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "wood-league-worker"
version = "0.1.0"
description = "Local analysis worker for the Wood League chess platform"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "questionary>=2.0",
    "python-chess>=1.11",
    "httpx>=0.27",
    "platformdirs>=4",
    "wood-league-shared",
]

[project.scripts]
wood-league-worker = "local_worker.cli:app"

[project.optional-dependencies]
dev = ["pytest>=8", "pytest-cov", "ruff", "mypy"]

[tool.uv.sources]
wood-league-shared = { workspace = true }

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.hatch.build.targets.wheel]
packages = ["local_worker"]
