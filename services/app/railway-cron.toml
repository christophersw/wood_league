# Railway cron service config — Chess.com ingest sweep.
#
# This file describes a SEPARATE Railway service (not the web app). To wire it up:
#   1. In the Railway dashboard, create a new service pointed at this same repo.
#   2. Set its config path to `services/app/railway-cron.toml`.
#   3. Set the cron schedule on the service (Railway UI: Settings → Cron Schedule)
#      to `*/15 * * * *` (or whatever cadence you prefer).
#   4. Share the same env vars as the web service (DATABASE_URL, CHESS_COM_USERNAMES,
#      ANALYSIS_DEPTH, LC0_NODES, etc).
#
# The cron service runs `sync_games`, which:
#   - Acquires a Postgres advisory lock (cron-overlap protection).
#   - Calls the existing run_sync.py to fetch Chess.com archives.
#   - Auto-enqueues AnalysisJobs per the SiteSettings toggles in the admin UI.

[build]
builder = "RAILPACK"

[deploy]
# One-shot command — exits when the sweep is done.
startCommand = "python manage.py sync_games"
# One-shot semantics: do NOT auto-restart if the run fails. The cron
# scheduler will fire the next invocation on its normal cadence; an
# in-process retry would just delay observability of transient failures.
restartPolicyType = "NEVER"
