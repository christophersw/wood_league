[project]
name = "wood-league-chess"
version = "2.1.0"
description = "Club chess analytics — Django + Tailwind + HTMX"
readme = "README.md"
requires-python = ">=3.13,<3.14"
dependencies = [
  "wood-league-shared @ git+https://github.com/christophersw/wood_league.git#subdirectory=packages/shared",
  "django>=5.0",
  "psycopg2-binary",
  "gunicorn",
  "whitenoise",
  "python-decouple",
  "dj-database-url",
  "django-tailwind-cli",
  "django-htmx",
  "djangorestframework>=3.15",
  "djangorestframework-api-key>=3.0",
  "python-chess>=1.999",
  "plotly>=5.20.0",
  "pandas>=2.2.0",
  "anthropic",
  "sqlalchemy>=2.0.29",
  "psycopg[binary]>=3.2.0",
  "passlib[bcrypt]>=1.7.4",
  "pydantic-settings>=2.8.0",
  "requests>=2.32.2",
  "httpx>=0.27.0",
  "croniter>=2.0.0",
  "tqdm>=4.66.0",
  "runpod>=1.7.0",
  "boto3>=1.34",
]

[tool.uv.sources]
wood-league-shared = { workspace = true }

[tool.setuptools.packages.find]
where = ["."]
include = ["app*", "accounts*", "analysis*", "config*", "dashboard*", "games*", "ingest*", "openings*", "players*", "search*"]

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
