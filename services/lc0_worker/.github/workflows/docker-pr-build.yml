name: Validate Lc0 RunPod Docker Build

concurrency:
  group: wood-league-lc0-runpod-pr-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

on:
  pull_request:
    branches:
      - main
      - master
    paths:
      - Dockerfile
      - handler.py
      - pyproject.toml
      - README.md
      - lc0_worker/**
      - .github/workflows/docker-pr-build.yml
      - .github/workflows/docker-publish.yml
  workflow_dispatch:

jobs:
  docker-build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read

    steps:
      - name: Free disk space
        uses: jlumbroso/free-disk-space@main
        with:
          tool-cache: false
          android: true
          dotnet: true
          haskell: true
          large-packages: true
          docker-images: true
          swap-storage: true

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build image (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          tags: wood-league-lc0-runpod:pr-check
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: false
          sbom: false