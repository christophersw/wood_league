name: Build lc0 RunPod Worker

on:
  push:
    branches: [main]
    paths:
      - "services/lc0_worker/**"
      - "packages/shared/**"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: services/lc0_worker/Dockerfile
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/wood-league-lc0-runpod:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
